name: ci

on:
  push:
  pull_request:

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Demo
        run: make demo

      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: iga-evidence-report
          path: |
            reports/evidence.json
            reports/evidence.md
            reports/evidence.html
          if-no-files-found: error
